<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" font-family="'NanumGothic','Nanum Gothic','Noto Sans CJK KR',sans-serif">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="chartBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1600" fill="#FFFFFF"/>

  <!-- Main Title -->
  <text x="600" y="50" font-size="28" font-weight="700" fill="#1E293B" text-anchor="middle">시장 동향 분석 및 인사이트</text>
  <text x="600" y="80" font-size="14" fill="#64748B" text-anchor="middle">AI 에이전트 · 소상공인/정육 · LLM 대중화</text>

  <!-- ========== SECTION 1: AI Agent Market ========== -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="1100" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- Section 1 Header -->
  <rect x="50" y="110" width="1100" height="50" rx="16" fill="url(#blueGrad)"/>
  <rect x="50" y="144" width="1100" height="16" fill="url(#blueGrad)"/>
  <text x="80" y="143" font-size="18" font-weight="700" fill="#FFFFFF">1. 글로벌 AI 에이전트 시장</text>
  <text x="1120" y="143" font-size="14" fill="#BFDBFE" text-anchor="end">CAGR 46~50%</text>

  <!-- Chart Area 1 -->
  <rect x="80" y="180" width="500" height="320" rx="8" fill="url(#chartBg)"/>

  <!-- Y-axis labels -->
  <text x="95" y="210" font-size="10" fill="#64748B">$200B</text>
  <text x="95" y="260" font-size="10" fill="#64748B">$150B</text>
  <text x="95" y="310" font-size="10" fill="#64748B">$100B</text>
  <text x="95" y="360" font-size="10" fill="#64748B">$50B</text>
  <text x="95" y="410" font-size="10" fill="#64748B">$0B</text>

  <!-- Grid lines -->
  <line x1="130" y1="205" x2="560" y2="205" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="130" y1="255" x2="560" y2="255" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="130" y1="305" x2="560" y2="305" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="130" y1="355" x2="560" y2="355" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="130" y1="405" x2="560" y2="405" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Bar Chart - AI Agent Market Size -->
  <rect x="150" y="398" width="40" height="7" rx="2" fill="#93C5FD"/>
  <text x="170" y="420" font-size="9" fill="#64748B" text-anchor="middle">2024</text>
  <text x="170" y="390" font-size="9" font-weight="600" fill="#3B82F6" text-anchor="middle">$5B</text>

  <rect x="210" y="390" width="40" height="15" rx="2" fill="#60A5FA"/>
  <text x="230" y="420" font-size="9" fill="#64748B" text-anchor="middle">2025</text>
  <text x="230" y="382" font-size="9" font-weight="600" fill="#3B82F6" text-anchor="middle">$8B</text>

  <rect x="270" y="380" width="40" height="25" rx="2" fill="#3B82F6"/>
  <text x="290" y="420" font-size="9" fill="#64748B" text-anchor="middle">2026</text>
  <text x="290" y="372" font-size="9" font-weight="600" fill="#3B82F6" text-anchor="middle">$11B</text>

  <rect x="330" y="355" width="40" height="50" rx="2" fill="#2563EB"/>
  <text x="350" y="420" font-size="9" fill="#64748B" text-anchor="middle">2028</text>
  <text x="350" y="347" font-size="9" font-weight="600" fill="#2563EB" text-anchor="middle">$25B</text>

  <rect x="390" y="305" width="40" height="100" rx="2" fill="#1D4ED8"/>
  <text x="410" y="420" font-size="9" fill="#64748B" text-anchor="middle">2030</text>
  <text x="410" y="297" font-size="9" font-weight="600" fill="#1D4ED8" text-anchor="middle">$53B</text>

  <rect x="450" y="205" width="40" height="200" rx="2" fill="#1E40AF"/>
  <text x="470" y="420" font-size="9" fill="#64748B" text-anchor="middle">2033</text>
  <text x="470" y="197" font-size="9" font-weight="600" fill="#1E40AF" text-anchor="middle">$139B</text>

  <rect x="510" y="195" width="40" height="210" rx="2" fill="#1E3A8A"/>
  <text x="530" y="420" font-size="9" fill="#64748B" text-anchor="middle">2034</text>
  <text x="530" y="187" font-size="9" font-weight="600" fill="#1E3A8A" text-anchor="middle">$199B</text>

  <!-- Chart Title -->
  <text x="345" y="475" font-size="12" fill="#475569" text-anchor="middle">글로벌 AI 에이전트 시장 규모 전망 (USD)</text>

  <!-- Key Insights 1 -->
  <g transform="translate(620, 190)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#1E293B">핵심 인사이트</text>

    <rect x="0" y="20" width="480" height="70" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="15" y="45" font-size="12" fill="#1E40AF" font-weight="600">시장 폭발적 성장</text>
    <text x="15" y="65" font-size="11" fill="#475569">2024년 $5B → 2034년 $199B (40배 성장)</text>
    <text x="15" y="82" font-size="11" fill="#475569">연평균 성장률(CAGR) 46~50%</text>

    <rect x="0" y="100" width="480" height="70" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="15" y="125" font-size="12" fill="#1E40AF" font-weight="600">기업 도입 가속화</text>
    <text x="15" y="145" font-size="11" fill="#475569">기업 AI 지출: 2023년 $1.7B → 2025년 $37B (22배)</text>
    <text x="15" y="162" font-size="11" fill="#475569">전체 SaaS 시장의 6% 점유, 역대 최고 성장 속도</text>

    <rect x="0" y="180" width="480" height="70" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="15" y="205" font-size="12" fill="#1E40AF" font-weight="600">시사점</text>
    <text x="15" y="225" font-size="11" fill="#475569">AI 에이전트 시장 초기 진입 적기 (2025~2027년)</text>
    <text x="15" y="242" font-size="11" fill="#475569">소상공인 특화 버티컬 AI 에이전트 = 블루오션</text>
  </g>

  <!-- ========== SECTION 2: 소상공인/정육 ========== -->
  <g filter="url(#shadow)">
    <rect x="50" y="550" width="1100" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- Section 2 Header -->
  <rect x="50" y="550" width="1100" height="50" rx="16" fill="url(#greenGrad)"/>
  <rect x="50" y="584" width="1100" height="16" fill="url(#greenGrad)"/>
  <text x="80" y="583" font-size="18" font-weight="700" fill="#FFFFFF">2. 한국 소상공인 및 정육 소비 동향</text>

  <!-- Chart Area 2 - Meat Consumption -->
  <rect x="80" y="620" width="500" height="320" rx="8" fill="url(#chartBg)"/>

  <!-- Line Chart - Meat Consumption -->
  <text x="95" y="650" font-size="10" fill="#64748B">65kg</text>
  <text x="95" y="700" font-size="10" fill="#64748B">60kg</text>
  <text x="95" y="750" font-size="10" fill="#64748B">55kg</text>
  <text x="95" y="800" font-size="10" fill="#64748B">50kg</text>
  <text x="95" y="850" font-size="10" fill="#64748B">45kg</text>

  <!-- Grid lines -->
  <line x1="130" y1="645" x2="560" y2="645" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="130" y1="695" x2="560" y2="695" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="130" y1="745" x2="560" y2="745" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="130" y1="795" x2="560" y2="795" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="130" y1="845" x2="560" y2="845" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Line chart path - Meat consumption -->
  <polyline points="160,795 230,765 300,735 370,705 440,695 510,685"
            stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="160" cy="795" r="6" fill="#10B981"/>
  <circle cx="230" cy="765" r="6" fill="#10B981"/>
  <circle cx="300" cy="735" r="6" fill="#10B981"/>
  <circle cx="370" cy="705" r="6" fill="#10B981"/>
  <circle cx="440" cy="695" r="6" fill="#10B981"/>
  <circle cx="510" cy="685" r="6" fill="#10B981"/>

  <!-- Data labels -->
  <text x="160" y="785" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">54.6</text>
  <text x="230" y="755" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">56.1</text>
  <text x="300" y="725" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">57.8</text>
  <text x="370" y="695" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">59.8</text>
  <text x="440" y="685" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">60.6</text>
  <text x="510" y="675" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">62.9</text>

  <!-- X-axis labels -->
  <text x="160" y="870" font-size="9" fill="#64748B" text-anchor="middle">2019</text>
  <text x="230" y="870" font-size="9" fill="#64748B" text-anchor="middle">2020</text>
  <text x="300" y="870" font-size="9" fill="#64748B" text-anchor="middle">2021</text>
  <text x="370" y="870" font-size="9" fill="#64748B" text-anchor="middle">2022</text>
  <text x="440" y="870" font-size="9" fill="#64748B" text-anchor="middle">2023</text>
  <text x="510" y="870" font-size="9" fill="#64748B" text-anchor="middle">2024</text>

  <!-- Rice consumption line (comparison) -->
  <polyline points="160,745 230,755 300,760 370,768 440,775 510,780"
            stroke="#F59E0B" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <text x="520" y="785" font-size="9" fill="#F59E0B">쌀</text>

  <!-- Legend -->
  <rect x="400" y="890" width="12" height="12" rx="2" fill="#10B981"/>
  <text x="418" y="900" font-size="10" fill="#475569">육류 소비량</text>
  <rect x="490" y="890" width="12" height="12" rx="2" fill="#F59E0B"/>
  <text x="508" y="900" font-size="10" fill="#475569">쌀 소비량</text>

  <!-- Chart Title -->
  <text x="345" y="920" font-size="12" fill="#475569" text-anchor="middle">1인당 연간 육류 소비량 추이 (kg)</text>

  <!-- Key Insights 2 -->
  <g transform="translate(620, 630)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#1E293B">핵심 인사이트</text>

    <rect x="0" y="20" width="480" height="70" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="15" y="45" font-size="12" fill="#065F46" font-weight="600">육류 소비 지속 성장</text>
    <text x="15" y="65" font-size="11" fill="#475569">2022년 사상 처음 육류 소비(59.8kg) > 쌀 소비(56.4kg)</text>
    <text x="15" y="82" font-size="11" fill="#475569">2024년 1인당 62.9kg, 매년 1~2% 증가 추세</text>

    <rect x="0" y="100" width="480" height="70" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="15" y="125" font-size="12" fill="#065F46" font-weight="600">소상공인 현황</text>
    <text x="15" y="145" font-size="11" fill="#475569">전체 소상공인: 613만개 (전년 대비 2.9% 증가)</text>
    <text x="15" y="162" font-size="11" fill="#475569">평균 연매출 1.97억원, 외식 가맹점 매출 6.1% 증가</text>

    <rect x="0" y="180" width="480" height="70" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="15" y="205" font-size="12" fill="#065F46" font-weight="600">시사점</text>
    <text x="15" y="225" font-size="11" fill="#475569">정육 시장 안정적 성장 → 정육점 CRM 수요 기반 견고</text>
    <text x="15" y="242" font-size="11" fill="#475569">국내산 선호도↑ → 동네 정육점 경쟁력 유지</text>
  </g>

  <!-- ========== SECTION 3: LLM 대중화 ========== -->
  <g filter="url(#shadow)">
    <rect x="50" y="990" width="1100" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- Section 3 Header -->
  <rect x="50" y="990" width="1100" height="50" rx="16" fill="url(#purpleGrad)"/>
  <rect x="50" y="1024" width="1100" height="16" fill="url(#purpleGrad)"/>
  <text x="80" y="1023" font-size="18" font-weight="700" fill="#FFFFFF">3. LLM 기술 대중화 현황</text>
  <text x="1120" y="1023" font-size="14" fill="#DDD6FE" text-anchor="end">ChatGPT WAU 9억명</text>

  <!-- Chart Area 3 -->
  <rect x="80" y="1060" width="500" height="320" rx="8" fill="url(#chartBg)"/>

  <!-- Bar Chart - ChatGPT Users -->
  <text x="95" y="1090" font-size="10" fill="#64748B">10억</text>
  <text x="95" y="1140" font-size="10" fill="#64748B">8억</text>
  <text x="95" y="1190" font-size="10" fill="#64748B">6억</text>
  <text x="95" y="1240" font-size="10" fill="#64748B">4억</text>
  <text x="95" y="1290" font-size="10" fill="#64748B">2억</text>
  <text x="95" y="1340" font-size="10" fill="#64748B">0</text>

  <!-- Grid lines -->
  <line x1="130" y1="1085" x2="560" y2="1085" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="130" y1="1135" x2="560" y2="1135" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="130" y1="1185" x2="560" y2="1185" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="130" y1="1235" x2="560" y2="1235" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="130" y1="1285" x2="560" y2="1285" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="130" y1="1335" x2="560" y2="1335" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Bar Chart - ChatGPT WAU Growth -->
  <rect x="170" y="1310" width="50" height="25" rx="3" fill="#C4B5FD"/>
  <text x="195" y="1360" font-size="9" fill="#64748B" text-anchor="middle">2023.11</text>
  <text x="195" y="1300" font-size="9" font-weight="600" fill="#7C3AED" text-anchor="middle">1억</text>

  <rect x="250" y="1285" width="50" height="50" rx="3" fill="#A78BFA"/>
  <text x="275" y="1360" font-size="9" fill="#64748B" text-anchor="middle">2024.8</text>
  <text x="275" y="1275" font-size="9" font-weight="600" fill="#7C3AED" text-anchor="middle">2억</text>

  <rect x="330" y="1235" width="50" height="100" rx="3" fill="#8B5CF6"/>
  <text x="355" y="1360" font-size="9" fill="#64748B" text-anchor="middle">2025.2</text>
  <text x="355" y="1225" font-size="9" font-weight="600" fill="#7C3AED" text-anchor="middle">4억</text>

  <rect x="410" y="1135" width="50" height="200" rx="3" fill="#7C3AED"/>
  <text x="435" y="1360" font-size="9" fill="#64748B" text-anchor="middle">2025.4</text>
  <text x="435" y="1125" font-size="9" font-weight="600" fill="#6D28D9" text-anchor="middle">8억</text>

  <rect x="490" y="1110" width="50" height="225" rx="3" fill="#6D28D9"/>
  <text x="515" y="1360" font-size="9" fill="#64748B" text-anchor="middle">2026.2</text>
  <text x="515" y="1100" font-size="9" font-weight="600" fill="#5B21B6" text-anchor="middle">9억</text>

  <!-- Chart Title -->
  <text x="345" y="1395" font-size="12" fill="#475569" text-anchor="middle">ChatGPT 주간 활성 사용자(WAU) 증가 추이</text>

  <!-- Key Insights 3 -->
  <g transform="translate(620, 1070)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#1E293B">핵심 인사이트</text>

    <rect x="0" y="20" width="480" height="70" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="15" y="45" font-size="12" fill="#5B21B6" font-weight="600">ChatGPT 폭발적 성장</text>
    <text x="15" y="65" font-size="11" fill="#475569">2025년 2월 4억 → 2026년 2월 9억 WAU (1년 2배↑)</text>
    <text x="15" y="82" font-size="11" fill="#475569">역사상 가장 빠른 소비자 제품 채택 속도</text>

    <rect x="0" y="100" width="480" height="70" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="15" y="125" font-size="12" fill="#5B21B6" font-weight="600">한국 시장</text>
    <text x="15" y="145" font-size="11" fill="#475569">국내 ChatGPT 월 사용자 2,031만명 (스마트폰 이용자 40%)</text>
    <text x="15" y="162" font-size="11" fill="#475569">다운로드당 매출 미국에 이어 세계 2위</text>

    <rect x="0" y="180" width="480" height="70" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="15" y="205" font-size="12" fill="#5B21B6" font-weight="600">기업 도입 현황</text>
    <text x="15" y="225" font-size="11" fill="#475569">기업 AI 도입률: 2023년 33% → 2024년 71% (2배↑)</text>
    <text x="15" y="242" font-size="11" fill="#475569">미국 근로자 56%가 업무에 생성형 AI 활용</text>
  </g>

  <!-- ========== BOTTOM: Overall Insight ========== -->
  <g filter="url(#shadow)">
    <rect x="50" y="1440" width="1100" height="120" rx="16" fill="#1E293B"/>
  </g>

  <text x="100" y="1480" font-size="16" font-weight="700" fill="#FFFFFF">종합 인사이트</text>

  <text x="100" y="1510" font-size="13" fill="#CBD5E1">① AI 에이전트 시장이 연 50% 성장하는 가운데, 한국은 LLM 도입에서 글로벌 선두권 (ChatGPT 매출 세계 2위)</text>
  <text x="100" y="1532" font-size="13" fill="#CBD5E1">② 정육 소비는 지속 증가 중이며, 613만 소상공인의 디지털 전환 수요가 본격화되는 시점</text>
  <text x="100" y="1554" font-size="13" fill="#F59E0B" font-weight="600">→ 소상공인 특화 AI 에이전트 시장 진입의 최적 타이밍 (2025~2027년)</text>

</svg>
