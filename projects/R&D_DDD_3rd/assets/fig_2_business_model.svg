<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="prodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="custGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="partnerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="moneyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10B981"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="600" y="45" font-size="24" font-weight="700" fill="#1E293B" text-anchor="middle">
    정육점 특화 AI 고객관리 에이전트 | 비즈니스 모델
  </text>

  <!-- CENTER: Product (WeaveOne) -->
  <g filter="url(#shadow)">
    <rect x="440" y="220" width="320" height="180" rx="20" fill="url(#prodGrad)"/>
    <text x="600" y="265" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      정육점 AI 고객관리 에이전트
    </text>
    <text x="600" y="290" font-size="13" fill="#E0E7FF" text-anchor="middle">(WeaveOne SaaS)</text>

    <line x1="470" y1="310" x2="730" y2="310" stroke="#A78BFA" stroke-width="1"/>

    <text x="480" y="340" font-size="12" fill="#E0E7FF">• RF1/RF2 이탈 예측 엔진</text>
    <text x="480" y="362" font-size="12" fill="#E0E7FF">• LLM 개인화 문자 자동 생성</text>
    <text x="480" y="384" font-size="12" fill="#E0E7FF">• 월 1회 자동 재학습 파이프라인</text>
  </g>

  <!-- LEFT: Customer (정육점 사장님) -->
  <g filter="url(#shadow)">
    <rect x="60" y="240" width="260" height="140" rx="16" fill="url(#custGrad)" stroke="#F59E0B" stroke-width="2"/>
    <text x="190" y="285" font-size="17" font-weight="700" fill="#92400E" text-anchor="middle">정육점 사장님</text>
    <text x="190" y="310" font-size="12" fill="#B45309" text-anchor="middle">(유료 고객 · B2B SaaS)</text>
    <text x="190" y="345" font-size="13" fill="#78350F" text-anchor="middle">국내 57,783개 매장</text>
    <text x="190" y="365" font-size="12" fill="#92400E" text-anchor="middle">디지털 도입률 15.4%</text>
  </g>

  <!-- RIGHT: Partner (더담우) -->
  <g filter="url(#shadow)">
    <rect x="880" y="240" width="260" height="140" rx="16" fill="url(#partnerGrad)" stroke="#3B82F6" stroke-width="2"/>
    <text x="1010" y="285" font-size="17" font-weight="700" fill="#1E40AF" text-anchor="middle">(주)더담우</text>
    <text x="1010" y="310" font-size="12" fill="#1D4ED8" text-anchor="middle">(영업 파트너)</text>
    <text x="1010" y="345" font-size="13" fill="#1E3A8A" text-anchor="middle">연 매출 1,000억 정육 유통사</text>
    <text x="1010" y="365" font-size="12" fill="#1E40AF" text-anchor="middle">전국 정육점 네트워크 보유</text>
  </g>

  <!-- BOTTOM: POS Data -->
  <g filter="url(#shadow)">
    <rect x="420" y="520" width="160" height="80" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <text x="500" y="555" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">POS 데이터</text>
    <text x="500" y="578" font-size="11" fill="#64748B" text-anchor="middle">구매이력·방문주기</text>
  </g>

  <!-- BOTTOM: SMS Provider -->
  <g filter="url(#shadow)">
    <rect x="620" y="520" width="160" height="80" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <text x="700" y="555" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">통신사 SMS</text>
    <text x="700" y="578" font-size="11" fill="#64748B" text-anchor="middle">문자 발송 인프라</text>
  </g>

  <!-- ===== ARROWS & LABELS ===== -->

  <!-- Customer → Product: 월 구독료 -->
  <path d="M 320 280 L 430 280" stroke="#10B981" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="335" y="255" width="80" height="22" rx="4" fill="#D1FAE5"/>
  <text x="375" y="270" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">월 구독료</text>

  <!-- Product → Customer: AI 서비스 -->
  <path d="M 430 340 L 320 340" stroke="#7C3AED" stroke-width="2.5" fill="none" marker-end="url(#arrowPurple)"/>
  <rect x="330" y="345" width="95" height="22" rx="4" fill="#EDE9FE"/>
  <text x="377" y="360" font-size="11" font-weight="600" fill="#5B21B6" text-anchor="middle">이탈예측+문자</text>

  <!-- Partner → Product: 매장 소개 -->
  <path d="M 880 280 L 770 280" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="790" y="255" width="80" height="22" rx="4" fill="#DBEAFE"/>
  <text x="830" y="270" font-size="11" font-weight="600" fill="#1E40AF" text-anchor="middle">매장 소개</text>

  <!-- Product → Partner: 건당 영업비 -->
  <path d="M 770 340 L 880 340" stroke="#10B981" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="785" y="345" width="90" height="22" rx="4" fill="#D1FAE5"/>
  <text x="830" y="360" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">10만원/계약</text>

  <!-- POS → Product -->
  <path d="M 500 520 L 540 410" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrowPurple)" stroke-dasharray="5,3"/>
  <text x="490" y="470" font-size="10" fill="#64748B">구매 데이터</text>

  <!-- Product → SMS Provider -->
  <path d="M 660 410 L 700 520" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrowPurple)" stroke-dasharray="5,3"/>
  <text x="700" y="470" font-size="10" fill="#64748B">발송 요청</text>

  <!-- ===== PRICING BOX ===== -->
  <g filter="url(#shadow)">
    <rect x="60" y="460" width="300" height="170" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="60" y="460" width="300" height="40" rx="14" fill="#10B981"/>
    <text x="210" y="487" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">수익 모델 (Revenue Model)</text>

    <text x="80" y="525" font-size="13" font-weight="600" fill="#1E293B">Basic 요금제</text>
    <text x="330" y="525" font-size="13" font-weight="700" fill="#10B981" text-anchor="end">33,000원/월</text>

    <text x="80" y="552" font-size="13" font-weight="600" fill="#1E293B">Premium 요금제</text>
    <text x="330" y="552" font-size="13" font-weight="700" fill="#10B981" text-anchor="end">55,000원/월</text>

    <text x="80" y="579" font-size="13" font-weight="600" fill="#1E293B">CRM 문자 발송</text>
    <text x="330" y="579" font-size="13" font-weight="700" fill="#10B981" text-anchor="end">+5원/건 마진</text>

    <text x="80" y="606" font-size="13" font-weight="600" fill="#1E293B">파트너 영업 수수료</text>
    <text x="330" y="606" font-size="13" font-weight="700" fill="#3B82F6" text-anchor="end">100,000원/계약</text>
  </g>

  <!-- ===== UNIT ECONOMICS BOX ===== -->
  <g filter="url(#shadow)">
    <rect x="840" y="460" width="300" height="170" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="840" y="460" width="300" height="40" rx="14" fill="#7C3AED"/>
    <text x="990" y="487" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">유닛 이코노믹스</text>

    <text x="860" y="525" font-size="13" font-weight="600" fill="#1E293B">CAC (고객 획득 비용)</text>
    <text x="1110" y="525" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="end">116,000원</text>

    <text x="860" y="552" font-size="13" font-weight="600" fill="#1E293B">LTV (고객 생애 가치)</text>
    <text x="1110" y="552" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="end">1,584,000원</text>

    <text x="860" y="579" font-size="13" font-weight="600" fill="#1E293B">LTV/CAC Ratio</text>
    <text x="1110" y="579" font-size="13" font-weight="700" fill="#10B981" text-anchor="end">13.7x</text>

    <text x="860" y="606" font-size="13" font-weight="600" fill="#1E293B">BEP (손익분기점)</text>
    <text x="1110" y="606" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="end">~1,000개 매장</text>
  </g>

  <!-- TOP RIGHT: Promo -->
  <g>
    <rect x="950" y="80" width="200" height="50" rx="25" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="1050" y="100" font-size="12" font-weight="600" fill="#92400E" text-anchor="middle">신규 가입</text>
    <text x="1050" y="118" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">첫 2개월 무료 체험</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="60" y="80" width="15" height="15" rx="3" fill="#10B981"/>
    <text x="82" y="92" font-size="11" fill="#475569">현금 흐름 (Revenue)</text>

    <rect x="200" y="80" width="15" height="15" rx="3" fill="#7C3AED"/>
    <text x="222" y="92" font-size="11" fill="#475569">가치 제공 (Value)</text>

    <rect x="340" y="80" width="15" height="15" rx="3" fill="#3B82F6"/>
    <text x="362" y="92" font-size="11" fill="#475569">파트너 협력</text>
  </g>
</svg>
