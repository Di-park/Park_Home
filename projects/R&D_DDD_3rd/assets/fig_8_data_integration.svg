<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" font-family="'NanumGothic','Nanum Gothic','Noto Sans CJK KR',sans-serif">
  <defs>
    <linearGradient id="integrateGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="400" fill="#FAFBFC"/>

  <!-- ===== SECTION 1: 파편화된 데이터 (소스별 구분) ===== -->
  <g transform="translate(30, 20)">
    <text x="220" y="22" font-size="15" font-weight="700" fill="#DC2626" text-anchor="middle">파편화된 매장 데이터</text>

    <!-- Source 1: POS 시스템 -->
    <g transform="translate(0, 40)" filter="url(#shadow)">
      <rect x="0" y="0" width="210" height="150" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
      <rect x="0" y="0" width="210" height="35" rx="12" fill="#3B82F6"/>
      <rect x="0" y="23" width="210" height="12" fill="#3B82F6"/>
      <text x="105" y="24" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">POS 시스템</text>

      <!-- Data items -->
      <g transform="translate(15, 50)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#EFF6FF"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#1D4ED8" text-anchor="middle">구매 품목</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">삼겹살, 목살...</text>
      </g>
      <g transform="translate(110, 50)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#EFF6FF"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#1D4ED8" text-anchor="middle">결제 금액</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">45,000원</text>
      </g>
      <g transform="translate(15, 100)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#EFF6FF"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#1D4ED8" text-anchor="middle">구매 일시</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">4/15 17:23</text>
      </g>
      <g transform="translate(110, 100)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#EFF6FF"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#1D4ED8" text-anchor="middle">구매량</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">1.5kg</text>
      </g>
    </g>

    <!-- Source 2: 고객 DB (연락처) -->
    <g transform="translate(225, 40)" filter="url(#shadow)">
      <rect x="0" y="0" width="210" height="150" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <rect x="0" y="0" width="210" height="35" rx="12" fill="#10B981"/>
      <rect x="0" y="23" width="210" height="12" fill="#10B981"/>
      <text x="105" y="24" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">고객 DB</text>

      <g transform="translate(15, 50)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#ECFDF5"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">고객명</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">김단골</text>
      </g>
      <g transform="translate(110, 50)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#ECFDF5"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">연락처</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">010-1234-****</text>
      </g>
      <g transform="translate(15, 100)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#ECFDF5"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">등록일</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">2024.01.15</text>
      </g>
      <g transform="translate(110, 100)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#ECFDF5"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">누적 방문</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">32회</text>
      </g>
    </g>

    <!-- Source 3: 사장님 기억/메모 -->
    <g transform="translate(0, 205)" filter="url(#shadow)">
      <rect x="0" y="0" width="210" height="150" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
      <rect x="0" y="0" width="210" height="35" rx="12" fill="#F59E0B"/>
      <rect x="0" y="23" width="210" height="12" fill="#F59E0B"/>
      <text x="105" y="24" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">사장님 기억/메모</text>

      <g transform="translate(15, 50)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#FEF3C7"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#D97706" text-anchor="middle">가족 수</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">4인 가족</text>
      </g>
      <g transform="translate(110, 50)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#FEF3C7"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#D97706" text-anchor="middle">선호 부위</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">삼겹살, 목살</text>
      </g>
      <g transform="translate(15, 100)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#FEF3C7"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#D97706" text-anchor="middle">특이사항</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">얇게 썰어줌</text>
      </g>
      <g transform="translate(110, 100)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#FEF3C7"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#D97706" text-anchor="middle">용도</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">주말 BBQ</text>
      </g>
    </g>

    <!-- Source 4: 캘린더/시즌 -->
    <g transform="translate(225, 205)" filter="url(#shadow)">
      <rect x="0" y="0" width="210" height="150" rx="12" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
      <rect x="0" y="0" width="210" height="35" rx="12" fill="#EC4899"/>
      <rect x="0" y="23" width="210" height="12" fill="#EC4899"/>
      <text x="105" y="24" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">캘린더/시즌</text>

      <g transform="translate(15, 50)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#FCE7F3"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#DB2777" text-anchor="middle">계절</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">여름 (BBQ)</text>
      </g>
      <g transform="translate(110, 50)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#FCE7F3"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#DB2777" text-anchor="middle">명절</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">추석 D-30</text>
      </g>
      <g transform="translate(15, 100)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#FCE7F3"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#DB2777" text-anchor="middle">요일</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">금요일</text>
      </g>
      <g transform="translate(110, 100)">
        <rect x="0" y="0" width="85" height="40" rx="6" fill="#FCE7F3"/>
        <text x="42" y="18" font-size="9" font-weight="600" fill="#DB2777" text-anchor="middle">날씨</text>
        <text x="42" y="32" font-size="8" fill="#64748B" text-anchor="middle">맑음 28°C</text>
      </g>
    </g>
  </g>

  <!-- ===== ARROW 1: 파편 → 통합 ===== -->
  <g transform="translate(480, 190)">
    <path d="M 0,0 L 60,0" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrowPurple)"/>
    <text x="30" y="-12" font-size="10" font-weight="600" fill="#7C3AED" text-anchor="middle">통합</text>
  </g>

  <!-- ===== SECTION 2: 데이터 통합 (AI 엔진) ===== -->
  <g transform="translate(560, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="270" rx="20" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>

    <!-- Header -->
    <rect x="0" y="0" width="260" height="50" rx="20" fill="url(#integrateGrad)"/>
    <rect x="0" y="30" width="260" height="20" fill="url(#integrateGrad)"/>
    <text x="130" y="33" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI 데이터 통합 엔진</text>

    <!-- Integrated customer profile -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="230" height="195" rx="12" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.5"/>

      <!-- Customer icon -->
      <circle cx="35" cy="35" r="22" fill="#EDE9FE"/>
      <circle cx="35" cy="28" r="10" fill="#8B5CF6"/>
      <ellipse cx="35" cy="48" rx="15" ry="8" fill="#8B5CF6"/>

      <!-- Customer info -->
      <text x="70" y="28" font-size="12" font-weight="700" fill="#5B21B6">김단골 고객</text>
      <text x="70" y="44" font-size="9" fill="#7C3AED">이탈 위험도: 73%</text>

      <!-- Integrated data summary -->
      <line x1="10" y1="65" x2="220" y2="65" stroke="#DDD6FE" stroke-width="1"/>

      <text x="15" y="85" font-size="9" fill="#475569">• 선호: 삼겹살, 목살 (구이용)</text>
      <text x="15" y="102" font-size="9" fill="#475569">• 가구: 4인, 평균 1.5kg/회</text>
      <text x="15" y="119" font-size="9" fill="#475569">• 패턴: 주말 방문, 14일 미방문</text>
      <text x="15" y="136" font-size="9" fill="#475569">• 시즌: 여름 BBQ, 추석 D-30</text>
      <text x="15" y="153" font-size="9" fill="#475569">• 특이: 얇게 썰기, 서비스 요청</text>

      <!-- Source indicators -->
      <g transform="translate(15, 165)">
        <circle cx="8" cy="8" r="6" fill="#3B82F6"/>
        <circle cx="28" cy="8" r="6" fill="#10B981"/>
        <circle cx="48" cy="8" r="6" fill="#F59E0B"/>
        <circle cx="68" cy="8" r="6" fill="#EC4899"/>
        <text x="85" y="12" font-size="8" fill="#94A3B8">4개 소스 통합</text>
      </g>
    </g>
  </g>

  <!-- ===== ARROW 2: 통합 → 개인화 ===== -->
  <g transform="translate(840, 190)">
    <path d="M 0,0 L 60,0" stroke="#10B981" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <text x="30" y="-12" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">LLM</text>
  </g>

  <!-- ===== SECTION 3: 개인화 문구 생성 ===== -->
  <g transform="translate(920, 35)">
    <text x="310" y="22" font-size="15" font-weight="700" fill="#059669" text-anchor="middle">개인화된 마케팅 문구</text>

    <!-- Message card -->
    <g transform="translate(60, 35)" filter="url(#shadow)">
      <rect x="0" y="0" width="500" height="295" rx="16" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>

      <!-- Header -->
      <rect x="0" y="0" width="500" height="45" rx="16" fill="url(#outputGrad)"/>
      <rect x="0" y="29" width="500" height="16" fill="url(#outputGrad)"/>
      <text x="250" y="30" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">김단골 고객님 맞춤 메시지</text>

      <!-- Phone mockup -->
      <g transform="translate(20, 60)">
        <rect x="0" y="0" width="200" height="215" rx="24" fill="#1E293B"/>
        <rect x="10" y="10" width="180" height="195" rx="16" fill="#FFFFFF"/>

        <!-- Message bubble -->
        <rect x="18" y="20" width="155" height="165" rx="12" fill="#ECFDF5"/>
        <text x="28" y="42" font-size="10" fill="#047857" font-weight="600">[OO정육점]</text>
        <text x="28" y="60" font-size="10" fill="#1E293B">김단골님, 요즘 뜸하시네요!</text>
        <text x="28" y="80" font-size="10" fill="#1E293B">4인 가족 주말 바베큐용</text>
        <text x="28" y="100" font-size="10" fill="#1E293B">삼겹살+목살 세트 준비했어요.</text>
        <text x="28" y="124" font-size="10" fill="#DC2626" font-weight="600">이번 주말 10% 할인!</text>
        <text x="28" y="148" font-size="10" fill="#1E293B">금요일까지 방문하시면</text>
        <text x="28" y="168" font-size="10" fill="#1E293B">특별 서비스 드려요 :)</text>
      </g>

      <!-- Personalization highlights with source mapping -->
      <g transform="translate(240, 60)">
        <text x="0" y="0" font-size="11" font-weight="700" fill="#059669">적용된 개인화 요소</text>

        <g transform="translate(0, 18)">
          <circle cx="8" cy="8" r="6" fill="#10B981"/>
          <text x="20" y="12" font-size="10" fill="#475569">고객명 (김단골님)</text>
          <rect x="160" y="0" width="70" height="18" rx="9" fill="#ECFDF5"/>
          <text x="195" y="13" font-size="8" fill="#059669" text-anchor="middle">고객 DB</text>
        </g>

        <g transform="translate(0, 45)">
          <circle cx="8" cy="8" r="6" fill="#F59E0B"/>
          <text x="20" y="12" font-size="10" fill="#475569">가구 정보 (4인 가족)</text>
          <rect x="160" y="0" width="70" height="18" rx="9" fill="#FEF3C7"/>
          <text x="195" y="13" font-size="8" fill="#D97706" text-anchor="middle">사장님 메모</text>
        </g>

        <g transform="translate(0, 72)">
          <circle cx="8" cy="8" r="6" fill="#3B82F6"/>
          <text x="20" y="12" font-size="10" fill="#475569">선호 부위 (삼겹살, 목살)</text>
          <rect x="160" y="0" width="70" height="18" rx="9" fill="#EFF6FF"/>
          <text x="195" y="13" font-size="8" fill="#1D4ED8" text-anchor="middle">POS 분석</text>
        </g>

        <g transform="translate(0, 99)">
          <circle cx="8" cy="8" r="6" fill="#F59E0B"/>
          <text x="20" y="12" font-size="10" fill="#475569">용도 (주말 바베큐)</text>
          <rect x="160" y="0" width="70" height="18" rx="9" fill="#FEF3C7"/>
          <text x="195" y="13" font-size="8" fill="#D97706" text-anchor="middle">사장님 메모</text>
        </g>

        <g transform="translate(0, 126)">
          <circle cx="8" cy="8" r="6" fill="#EC4899"/>
          <text x="20" y="12" font-size="10" fill="#475569">타이밍 (금요일)</text>
          <rect x="160" y="0" width="70" height="18" rx="9" fill="#FCE7F3"/>
          <text x="195" y="13" font-size="8" fill="#DB2777" text-anchor="middle">캘린더</text>
        </g>

        <g transform="translate(0, 153)">
          <circle cx="8" cy="8" r="6" fill="#3B82F6"/>
          <text x="20" y="12" font-size="10" fill="#475569">긴급성 (14일 미방문)</text>
          <rect x="160" y="0" width="70" height="18" rx="9" fill="#EFF6FF"/>
          <text x="195" y="13" font-size="8" fill="#1D4ED8" text-anchor="middle">POS 분석</text>
        </g>

        <!-- Legend -->
        <g transform="translate(0, 190)">
          <rect x="0" y="0" width="240" height="30" rx="6" fill="#F8FAFC"/>
          <circle cx="20" cy="15" r="5" fill="#3B82F6"/>
          <text x="30" y="18" font-size="8" fill="#64748B">POS</text>
          <circle cx="70" cy="15" r="5" fill="#10B981"/>
          <text x="80" y="18" font-size="8" fill="#64748B">고객DB</text>
          <circle cx="130" cy="15" r="5" fill="#F59E0B"/>
          <text x="140" y="18" font-size="8" fill="#64748B">메모</text>
          <circle cx="185" cy="15" r="5" fill="#EC4899"/>
          <text x="195" y="18" font-size="8" fill="#64748B">캘린더</text>
        </g>
      </g>
    </g>
  </g>

</svg>
