<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" font-family="'NanumGothic','Nanum Gothic','Noto Sans CJK KR',sans-serif">
  <defs>
    <linearGradient id="integrateGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="400" fill="#FAFBFC"/>

  <!-- ===== SECTION 1: 파편화된 데이터 ===== -->
  <g transform="translate(50, 30)">
    <text x="200" y="25" font-size="16" font-weight="700" fill="#DC2626" text-anchor="middle">파편화된 매장 데이터</text>

    <!-- Data fragments - scattered look -->
    <!-- Fragment 1: POS 구매 -->
    <g transform="translate(20, 50)" filter="url(#shadow)">
      <rect x="0" y="0" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#F87171" stroke-width="2"/>
      <rect x="0" y="0" width="120" height="25" rx="10" fill="#FEE2E2"/>
      <rect x="0" y="15" width="120" height="10" fill="#FEE2E2"/>
      <text x="60" y="18" font-size="10" font-weight="600" fill="#DC2626" text-anchor="middle">POS 구매이력</text>
      <text x="60" y="42" font-size="9" fill="#64748B" text-anchor="middle">삼겹살 2kg</text>
      <text x="60" y="56" font-size="9" fill="#64748B" text-anchor="middle">항정살 500g...</text>
    </g>

    <!-- Fragment 2: 방문 기록 -->
    <g transform="translate(160, 80)" filter="url(#shadow)">
      <rect x="0" y="0" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#FB923C" stroke-width="2"/>
      <rect x="0" y="0" width="120" height="25" rx="10" fill="#FFEDD5"/>
      <rect x="0" y="15" width="120" height="10" fill="#FFEDD5"/>
      <text x="60" y="18" font-size="10" font-weight="600" fill="#EA580C" text-anchor="middle">방문 기록</text>
      <text x="60" y="42" font-size="9" fill="#64748B" text-anchor="middle">최근 방문: 14일 전</text>
      <text x="60" y="56" font-size="9" fill="#64748B" text-anchor="middle">평균 주기: 7일</text>
    </g>

    <!-- Fragment 3: 선호 부위 -->
    <g transform="translate(80, 170)" filter="url(#shadow)">
      <rect x="0" y="0" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#FBBF24" stroke-width="2"/>
      <rect x="0" y="0" width="120" height="25" rx="10" fill="#FEF3C7"/>
      <rect x="0" y="15" width="120" height="10" fill="#FEF3C7"/>
      <text x="60" y="18" font-size="10" font-weight="600" fill="#D97706" text-anchor="middle">선호 부위</text>
      <text x="60" y="42" font-size="9" fill="#64748B" text-anchor="middle">삼겹살 45%</text>
      <text x="60" y="56" font-size="9" fill="#64748B" text-anchor="middle">목살 30%...</text>
    </g>

    <!-- Fragment 4: 가구 정보 -->
    <g transform="translate(220, 200)" filter="url(#shadow)">
      <rect x="0" y="0" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#A3E635" stroke-width="2"/>
      <rect x="0" y="0" width="120" height="25" rx="10" fill="#ECFCCB"/>
      <rect x="0" y="15" width="120" height="10" fill="#ECFCCB"/>
      <text x="60" y="18" font-size="10" font-weight="600" fill="#65A30D" text-anchor="middle">가구 정보</text>
      <text x="60" y="42" font-size="9" fill="#64748B" text-anchor="middle">4인 가족</text>
      <text x="60" y="56" font-size="9" fill="#64748B" text-anchor="middle">평균 구매량 1.5kg</text>
    </g>

    <!-- Fragment 5: 계절/명절 -->
    <g transform="translate(300, 100)" filter="url(#shadow)">
      <rect x="0" y="0" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
      <rect x="0" y="0" width="120" height="25" rx="10" fill="#E0F2FE"/>
      <rect x="0" y="15" width="120" height="10" fill="#E0F2FE"/>
      <text x="60" y="18" font-size="10" font-weight="600" fill="#0284C7" text-anchor="middle">계절/명절</text>
      <text x="60" y="42" font-size="9" fill="#64748B" text-anchor="middle">추석 갈비 구매</text>
      <text x="60" y="56" font-size="9" fill="#64748B" text-anchor="middle">여름 BBQ 증가</text>
    </g>

    <!-- Scattered dots for visual effect -->
    <circle cx="30" cy="150" r="4" fill="#FCA5A5" opacity="0.5"/>
    <circle cx="180" cy="60" r="3" fill="#FDBA74" opacity="0.5"/>
    <circle cx="350" cy="180" r="5" fill="#FDE047" opacity="0.5"/>
    <circle cx="280" cy="280" r="4" fill="#86EFAC" opacity="0.5"/>
    <circle cx="100" cy="280" r="3" fill="#7DD3FC" opacity="0.5"/>
  </g>

  <!-- ===== ARROW 1: 파편 → 통합 ===== -->
  <g transform="translate(470, 180)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrowPurple)"/>
    <text x="40" y="-15" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">통합</text>
  </g>

  <!-- ===== SECTION 2: 데이터 통합 (AI 엔진) ===== -->
  <g transform="translate(570, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>

    <!-- Header -->
    <rect x="0" y="0" width="280" height="50" rx="20" fill="url(#integrateGrad)"/>
    <rect x="0" y="30" width="280" height="20" fill="url(#integrateGrad)"/>
    <text x="140" y="33" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI 데이터 통합 엔진</text>

    <!-- Integrated customer profile -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="240" height="155" rx="12" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.5"/>

      <!-- Customer icon -->
      <circle cx="40" cy="40" r="25" fill="#EDE9FE"/>
      <circle cx="40" cy="32" r="12" fill="#8B5CF6"/>
      <ellipse cx="40" cy="55" rx="18" ry="10" fill="#8B5CF6"/>

      <!-- Customer info -->
      <text x="80" y="30" font-size="13" font-weight="700" fill="#5B21B6">김단골 고객</text>
      <text x="80" y="48" font-size="10" fill="#7C3AED">이탈 위험도: 높음 (73%)</text>

      <!-- Integrated data summary -->
      <line x1="10" y1="75" x2="230" y2="75" stroke="#DDD6FE" stroke-width="1"/>

      <text x="20" y="95" font-size="10" fill="#475569">• 선호: 삼겹살, 목살 (구이용)</text>
      <text x="20" y="112" font-size="10" fill="#475569">• 가구: 4인, 평균 1.5kg/회</text>
      <text x="20" y="129" font-size="10" fill="#475569">• 패턴: 주말 방문, 14일 미방문</text>
      <text x="20" y="146" font-size="10" fill="#475569">• 특이: 추석 갈비세트 구매 이력</text>
    </g>
  </g>

  <!-- ===== ARROW 2: 통합 → 개인화 ===== -->
  <g transform="translate(870, 180)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#10B981" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <text x="40" y="-15" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">LLM</text>
  </g>

  <!-- ===== SECTION 3: 개인화 문구 생성 ===== -->
  <g transform="translate(970, 50)">
    <text x="290" y="25" font-size="16" font-weight="700" fill="#059669" text-anchor="middle">개인화된 마케팅 문구</text>

    <!-- Message card -->
    <g transform="translate(80, 45)" filter="url(#shadow)">
      <rect x="0" y="0" width="420" height="260" rx="16" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>

      <!-- Header -->
      <rect x="0" y="0" width="420" height="45" rx="16" fill="url(#outputGrad)"/>
      <rect x="0" y="29" width="420" height="16" fill="url(#outputGrad)"/>
      <text x="210" y="30" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">김단골 고객님 맞춤 메시지</text>

      <!-- Phone mockup -->
      <g transform="translate(20, 60)">
        <rect x="0" y="0" width="180" height="180" rx="20" fill="#1E293B"/>
        <rect x="8" y="8" width="164" height="164" rx="14" fill="#FFFFFF"/>

        <!-- Message bubble -->
        <rect x="15" y="20" width="145" height="130" rx="10" fill="#ECFDF5"/>
        <text x="25" y="42" font-size="9" fill="#047857" font-weight="600">[OO정육점]</text>
        <text x="25" y="58" font-size="9" fill="#1E293B">김단골님, 요즘 뜸하시네요!</text>
        <text x="25" y="74" font-size="9" fill="#1E293B">4인 가족 주말 바베큐용</text>
        <text x="25" y="90" font-size="9" fill="#1E293B">삼겹살+목살 세트 준비했어요.</text>
        <text x="25" y="110" font-size="9" fill="#DC2626" font-weight="600">이번 주말 10% 할인!</text>
        <text x="25" y="130" font-size="9" fill="#1E293B">금요일까지 방문하시면</text>
        <text x="25" y="146" font-size="9" fill="#1E293B">특별 서비스 드려요 :)</text>
      </g>

      <!-- Personalization highlights -->
      <g transform="translate(215, 65)">
        <text x="0" y="0" font-size="11" font-weight="700" fill="#059669">적용된 개인화 요소</text>

        <g transform="translate(0, 20)">
          <rect x="0" y="0" width="16" height="16" rx="4" fill="#DCFCE7"/>
          <text x="8" y="12" font-size="10" fill="#059669" text-anchor="middle">✓</text>
          <text x="24" y="12" font-size="10" fill="#475569">고객명 (김단골님)</text>
        </g>

        <g transform="translate(0, 45)">
          <rect x="0" y="0" width="16" height="16" rx="4" fill="#DCFCE7"/>
          <text x="8" y="12" font-size="10" fill="#059669" text-anchor="middle">✓</text>
          <text x="24" y="12" font-size="10" fill="#475569">가구 정보 (4인 가족)</text>
        </g>

        <g transform="translate(0, 70)">
          <rect x="0" y="0" width="16" height="16" rx="4" fill="#DCFCE7"/>
          <text x="8" y="12" font-size="10" fill="#059669" text-anchor="middle">✓</text>
          <text x="24" y="12" font-size="10" fill="#475569">선호 부위 (삼겹살, 목살)</text>
        </g>

        <g transform="translate(0, 95)">
          <rect x="0" y="0" width="16" height="16" rx="4" fill="#DCFCE7"/>
          <text x="8" y="12" font-size="10" fill="#059669" text-anchor="middle">✓</text>
          <text x="24" y="12" font-size="10" fill="#475569">용도 (바베큐/구이)</text>
        </g>

        <g transform="translate(0, 120)">
          <rect x="0" y="0" width="16" height="16" rx="4" fill="#DCFCE7"/>
          <text x="8" y="12" font-size="10" fill="#059669" text-anchor="middle">✓</text>
          <text x="24" y="12" font-size="10" fill="#475569">방문 패턴 (주말)</text>
        </g>

        <g transform="translate(0, 145)">
          <rect x="0" y="0" width="16" height="16" rx="4" fill="#DCFCE7"/>
          <text x="8" y="12" font-size="10" fill="#059669" text-anchor="middle">✓</text>
          <text x="24" y="12" font-size="10" fill="#475569">이탈 위험 (긴급성 강조)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom label -->
  <rect x="550" y="355" width="500" height="35" rx="17" fill="#F1F5F9"/>
  <text x="800" y="378" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">
    5개 이상의 파편 데이터 → 1개의 통합 고객 프로필 → 1:1 맞춤 메시지
  </text>

</svg>
