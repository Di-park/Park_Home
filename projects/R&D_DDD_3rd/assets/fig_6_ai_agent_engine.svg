<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="'NanumGothic','Nanum Gothic','Noto Sans CJK KR',sans-serif">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="url(#skyGrad)"/>

  <!-- Title -->
  <text x="700" y="50" font-size="28" font-weight="700" fill="#1E293B" text-anchor="middle">
    소상공인 AI 고객관리 에이전트 개발 구조
  </text>

  <!-- ===== LEFT SIDE: 정육점 사장님 ===== -->
  <g transform="translate(80, 200)">
    <!-- Shop Icon -->
    <g filter="url(#softShadow)">
      <!-- Shop building -->
      <rect x="0" y="80" width="160" height="120" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <!-- Roof -->
      <polygon points="80,-10 -20,80 180,80" fill="#DC2626"/>
      <!-- Sign -->
      <rect x="30" y="100" width="100" height="35" rx="6" fill="#FEE2E2"/>
      <text x="80" y="124" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">정육점</text>
      <!-- Door -->
      <rect x="55" y="140" width="50" height="60" rx="4" fill="#78716C"/>
      <!-- Window -->
      <rect x="15" y="145" width="30" height="30" rx="4" fill="#BFDBFE"/>
      <rect x="115" y="145" width="30" height="30" rx="4" fill="#BFDBFE"/>
    </g>

    <!-- Owner figure -->
    <g transform="translate(60, 220)">
      <!-- Body -->
      <ellipse cx="20" cy="90" rx="25" ry="30" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <!-- Head -->
      <circle cx="20" cy="40" r="25" fill="#FED7AA"/>
      <!-- Apron -->
      <rect x="0" y="65" width="40" height="50" rx="4" fill="#DC2626"/>
      <!-- Face -->
      <circle cx="12" cy="35" r="3" fill="#1E293B"/>
      <circle cx="28" cy="35" r="3" fill="#1E293B"/>
      <path d="M 12 50 Q 20 58 28 50" stroke="#1E293B" stroke-width="2" fill="none"/>
      <!-- Label -->
      <text x="20" y="145" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">사장님</text>
    </g>

    <!-- Speech bubble: 문제점 -->
    <g transform="translate(130, 280)">
      <path d="M 0,0 L 30,0 L 30,80 L 10,80 L 0,100 L 5,80 L 0,80 Z" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
      <text x="15" y="25" font-size="10" fill="#DC2626" text-anchor="middle">"단골이</text>
      <text x="15" y="40" font-size="10" fill="#DC2626" text-anchor="middle">왜 안오지?"</text>
      <text x="15" y="60" font-size="10" fill="#DC2626" text-anchor="middle">"마케팅</text>
      <text x="15" y="75" font-size="10" fill="#DC2626" text-anchor="middle">할 시간이..."</text>
    </g>
  </g>

  <!-- ===== CENTER: AI 에이전트 시스템 ===== -->
  <!-- Main AI Brain/Hub -->
  <g transform="translate(700, 400)" filter="url(#glow)">
    <!-- Outer ring - 전체 시스템 -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-dasharray="10,5"/>
    <text x="0" y="-235" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">AI 고객관리 에이전트 (전체 시스템)</text>

    <!-- Middle ring - 기 구축 -->
    <circle cx="0" cy="0" r="170" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="0" y="-180" font-size="11" fill="#64748B" text-anchor="middle">기 구축 (Pre-R&amp;D)</text>

    <!-- Inner core - 본 과제 (Brain shape) -->
    <ellipse cx="0" cy="0" rx="120" ry="100" fill="url(#brainGrad)" filter="url(#shadow)"/>

    <!-- Brain pattern lines -->
    <path d="M -80,0 Q -40,-40 0,-20 Q 40,-50 80,0" stroke="#A78BFA" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M -60,30 Q 0,0 60,30" stroke="#A78BFA" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M -40,-40 Q 0,-60 40,-40" stroke="#A78BFA" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- AI icon in center -->
    <circle cx="0" cy="-10" r="35" fill="#FFFFFF" opacity="0.2"/>
    <text x="0" y="0" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">AI</text>
    <text x="0" y="20" font-size="10" fill="#EDE9FE" text-anchor="middle">의사결정 엔진</text>

    <!-- 본 과제 label -->
    <rect x="-50" y="65" width="100" height="24" rx="12" fill="#7C3AED"/>
    <text x="0" y="82" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">본 과제 (디딤돌)</text>
  </g>

  <!-- Three core capabilities orbiting -->
  <!-- 1. 타겟 추출 (누구에게) - Top -->
  <g transform="translate(700, 160)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="55" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3"/>
    <!-- Target icon -->
    <circle cx="0" cy="-10" r="25" fill="none" stroke="#3B82F6" stroke-width="3"/>
    <circle cx="0" cy="-10" r="15" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="0" cy="-10" r="5" fill="#3B82F6"/>
    <text x="0" y="30" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">타겟 추출</text>
    <text x="0" y="45" font-size="10" fill="#3B82F6" text-anchor="middle">누구에게</text>
    <!-- Connecting line -->
    <line x1="0" y1="55" x2="0" y2="130" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- 2. 개인화 생성 (무엇을) - Left -->
  <g transform="translate(470, 450)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="55" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
    <!-- Message icon -->
    <rect x="-20" y="-25" width="40" height="30" rx="6" fill="#10B981"/>
    <rect x="-15" y="-20" width="20" height="3" rx="1" fill="#FFFFFF"/>
    <rect x="-15" y="-13" width="25" height="3" rx="1" fill="#FFFFFF"/>
    <rect x="-15" y="-6" width="15" height="3" rx="1" fill="#FFFFFF"/>
    <text x="0" y="25" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">개인화 생성</text>
    <text x="0" y="40" font-size="10" fill="#10B981" text-anchor="middle">무엇을</text>
    <!-- Connecting line -->
    <line x1="55" y1="0" x2="110" y2="-30" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- 3. 발송 최적화 (언제) - Right -->
  <g transform="translate(930, 450)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="55" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/>
    <!-- Clock icon -->
    <circle cx="0" cy="-8" r="22" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <line x1="0" y1="-8" x2="0" y2="-18" stroke="#F59E0B" stroke-width="3"/>
    <line x1="0" y1="-8" x2="10" y2="-3" stroke="#F59E0B" stroke-width="2"/>
    <text x="0" y="30" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">발송 최적화</text>
    <text x="0" y="45" font-size="10" fill="#F59E0B" text-anchor="middle">언제</text>
    <!-- Connecting line -->
    <line x1="-55" y1="0" x2="-110" y2="-30" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Pre-R&D components around the ring -->
  <!-- POS -->
  <g transform="translate(530, 280)">
    <rect x="-30" y="-20" width="60" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="0" y="5" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">POS</text>
  </g>
  <!-- 방문분석 -->
  <g transform="translate(870, 280)">
    <rect x="-35" y="-20" width="70" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="0" y="5" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">방문분석</text>
  </g>
  <!-- 발송시스템 -->
  <g transform="translate(700, 620)">
    <rect x="-40" y="-20" width="80" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="0" y="5" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">발송시스템</text>
  </g>

  <!-- ===== ARROW: 정육점 to AI ===== -->
  <g>
    <path d="M 280 400 Q 350 400 420 400" stroke="#94A3B8" stroke-width="3" fill="none" marker-end="url(#arrowGray)"/>
    <rect x="310" y="380" width="80" height="24" rx="12" fill="#F1F5F9"/>
    <text x="350" y="396" font-size="10" fill="#64748B" text-anchor="middle">데이터 연동</text>
  </g>

  <!-- ===== RIGHT SIDE: 결과/효과 ===== -->
  <!-- Arrow from AI to Results -->
  <path d="M 930 400 Q 1000 400 1050 400" stroke="url(#greenGrad)" stroke-width="4" fill="none"/>
  <polygon points="1050,390 1070,400 1050,410" fill="#10B981"/>

  <!-- Results Panel -->
  <g transform="translate(1100, 180)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="480" rx="20" fill="#FFFFFF"/>

    <!-- Header -->
    <rect x="0" y="0" width="250" height="50" rx="20" fill="url(#greenGrad)"/>
    <rect x="0" y="30" width="250" height="20" fill="url(#greenGrad)"/>
    <text x="125" y="33" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">기대 효과</text>

    <!-- Metric 1: 이탈률 -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="210" height="70" rx="12" fill="#FEF2F2"/>
      <text x="105" y="25" font-size="12" font-weight="600" fill="#DC2626" text-anchor="middle">고객 이탈률</text>
      <text x="105" y="55" font-size="24" font-weight="800" fill="#B91C1C" text-anchor="middle">-30%</text>
    </g>

    <!-- Metric 2: 재방문 -->
    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="210" height="70" rx="12" fill="#ECFDF5"/>
      <text x="105" y="25" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">재방문율</text>
      <text x="105" y="55" font-size="24" font-weight="800" fill="#047857" text-anchor="middle">+25%</text>
    </g>

    <!-- Metric 3: 매출 -->
    <g transform="translate(20, 240)">
      <rect x="0" y="0" width="210" height="70" rx="12" fill="#EFF6FF"/>
      <text x="105" y="25" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="middle">매장 매출</text>
      <text x="105" y="55" font-size="24" font-weight="800" fill="#1E40AF" text-anchor="middle">+10~15%</text>
    </g>

    <!-- Metric 4: 비용절감 -->
    <g transform="translate(20, 325)">
      <rect x="0" y="0" width="210" height="70" rx="12" fill="#FEF3C7"/>
      <text x="105" y="25" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">마케팅 비용</text>
      <text x="105" y="55" font-size="24" font-weight="800" fill="#B45309" text-anchor="middle">-50%</text>
    </g>

    <!-- Metric 5: Zero-Task -->
    <g transform="translate(20, 410)">
      <rect x="0" y="0" width="210" height="55" rx="12" fill="#7C3AED"/>
      <text x="105" y="25" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">사장님 운영 부담</text>
      <text x="105" y="47" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">Zero-Task</text>
    </g>
  </g>

  <!-- Happy owner result -->
  <g transform="translate(1180, 700)">
    <!-- Body -->
    <ellipse cx="20" cy="90" rx="25" ry="30" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Head -->
    <circle cx="20" cy="40" r="25" fill="#FED7AA"/>
    <!-- Apron -->
    <rect x="0" y="65" width="40" height="50" rx="4" fill="#10B981"/>
    <!-- Happy face -->
    <circle cx="12" cy="35" r="3" fill="#1E293B"/>
    <circle cx="28" cy="35" r="3" fill="#1E293B"/>
    <path d="M 10 48 Q 20 60 30 48" stroke="#1E293B" stroke-width="2" fill="none"/>
    <!-- Sparkles -->
    <text x="-15" y="30" font-size="16">✨</text>
    <text x="45" y="25" font-size="16">✨</text>
    <!-- Label -->
    <text x="20" y="145" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">AI가 대신!</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 750)">
    <rect x="0" y="0" width="500" height="100" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="20" y="30" font-size="13" font-weight="700" fill="#1E293B">범례</text>

    <circle cx="40" cy="55" r="12" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="60" y="60" font-size="11" fill="#64748B">기 구축 (Pre-R&amp;D)</text>

    <circle cx="180" cy="55" r="12" fill="url(#brainGrad)"/>
    <text x="200" y="60" font-size="11" fill="#6D28D9">본 과제 (디딤돌)</text>

    <circle cx="320" cy="55" r="12" fill="url(#greenGrad)"/>
    <text x="340" y="60" font-size="11" fill="#059669">기대 효과</text>

    <text x="20" y="85" font-size="10" fill="#94A3B8">* 본 과제 완료 시 "사장님이 아무것도 하지 않아도 AI가 고객관리를 자동 수행"</text>
  </g>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8"/>
    </marker>
  </defs>

</svg>
