<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" font-family="'NanumGothic','Nanum Gothic','Noto Sans CJK KR',sans-serif">
  <defs>
    <linearGradient id="grayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="950" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="700" y="45" font-size="24" font-weight="700" fill="#1E293B" text-anchor="middle">
    소상공인 오프라인 리테일 마케팅 의사결정 자동화를 위한 자가학습형 AI 운영체제 개발
  </text>

  <!-- ==================== SECTION 1: 개발 현황 (Pre-R&amp;D) ==================== -->
  <g filter="url(#shadow)">
    <rect x="50" y="80" width="620" height="320" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>

    <!-- Header -->
    <rect x="50" y="80" width="620" height="50" rx="16" fill="url(#grayGrad)"/>
    <rect x="50" y="114" width="620" height="16" fill="url(#grayGrad)"/>
    <text x="360" y="112" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">개발 현황 (Pre-R&amp;D)</text>

    <!-- Badge -->
    <rect x="65" y="65" width="80" height="26" rx="13" fill="#64748B"/>
    <text x="105" y="83" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">기 구축</text>

    <!-- Subtitle -->
    <text x="360" y="160" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">규칙 기반 마케팅 자동화 도구</text>

    <!-- Flow: 3 boxes -->
    <g transform="translate(80, 185)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="160" height="90" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="80" y="25" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">기능1</text>
      <text x="80" y="45" font-size="11" fill="#64748B" text-anchor="middle">규칙 기반</text>
      <text x="80" y="62" font-size="11" fill="#64748B" text-anchor="middle">고객 분류</text>
      <text x="80" y="82" font-size="9" fill="#94A3B8" text-anchor="middle">월 1회 / 일반통계</text>

      <!-- Arrow -->
      <line x1="170" y1="45" x2="200" y2="45" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)"/>

      <!-- Box 2 -->
      <rect x="210" y="0" width="160" height="90" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="290" y="25" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">기능2</text>
      <text x="290" y="45" font-size="11" fill="#64748B" text-anchor="middle">문구 자동 생성</text>
      <text x="290" y="62" font-size="11" fill="#64748B" text-anchor="middle">(LLM)</text>
      <text x="290" y="82" font-size="9" fill="#94A3B8" text-anchor="middle">품목 선택 → 문구</text>

      <!-- Arrow -->
      <line x1="380" y1="45" x2="410" y2="45" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)"/>

      <!-- Box 3 -->
      <rect x="420" y="0" width="160" height="90" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="500" y="25" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">기능3</text>
      <text x="500" y="45" font-size="11" fill="#64748B" text-anchor="middle">고객별</text>
      <text x="500" y="62" font-size="11" fill="#64748B" text-anchor="middle">문자 발송</text>
      <text x="500" y="82" font-size="9" fill="#94A3B8" text-anchor="middle">수동 선택 / 수동 발송</text>
    </g>

    <!-- 사장님 경험 (기존) -->
    <rect x="80" y="300" width="560" height="45" rx="8" fill="#FEE2E2"/>
    <text x="360" y="328" font-size="12" fill="#DC2626" text-anchor="middle">
      사장님: 뭐 팔지 고민 → 고객 고르기 → 문자 쓰기 → 발송 (분석 → 판단 → 실행)
    </text>
  </g>

  <!-- ==================== 고도화 화살표 ==================== -->
  <g transform="translate(700, 240)">
    <polygon points="0,0 40,40 0,80 15,40" fill="#7C3AED"/>
    <text x="55" y="45" font-size="13" font-weight="700" fill="#7C3AED">고도화</text>
    <text x="55" y="62" font-size="10" fill="#8B5CF6">(본 과제)</text>
  </g>

  <!-- ==================== SECTION 2: 개발 목표 (본 과제) ==================== -->
  <g filter="url(#shadow)">
    <rect x="730" y="80" width="620" height="320" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>

    <!-- Header -->
    <rect x="730" y="80" width="620" height="50" rx="16" fill="url(#purpleGrad)"/>
    <rect x="730" y="114" width="620" height="16" fill="url(#purpleGrad)"/>
    <text x="1040" y="112" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">개발 목표 (본 과제)</text>

    <!-- Badge -->
    <rect x="745" y="65" width="80" height="26" rx="13" fill="#7C3AED"/>
    <text x="785" y="83" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">디딤돌</text>

    <!-- Subtitle -->
    <text x="1040" y="160" font-size="14" font-weight="600" fill="#5B21B6" text-anchor="middle">자가학습 마케팅 루프 기반 AI 마케팅 운영체제</text>

    <!-- Circular Flow -->
    <g transform="translate(1040, 230)">
      <!-- Center circle -->
      <circle cx="0" cy="0" r="35" fill="#7C3AED"/>
      <text x="0" y="-5" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI</text>
      <text x="0" y="10" font-size="9" fill="#EDE9FE" text-anchor="middle">어시스턴트</text>

      <!-- Box 1: 데이터 수집 (Top) -->
      <g transform="translate(-200, -85)">
        <rect x="0" y="0" width="120" height="55" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
        <text x="60" y="20" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">기능1</text>
        <text x="60" y="35" font-size="9" fill="#3B82F6" text-anchor="middle">자동 데이터 수집</text>
        <text x="60" y="48" font-size="9" fill="#3B82F6" text-anchor="middle">ML 고객 분류</text>
      </g>

      <!-- Box 2: 개인화 생성 (Right) -->
      <g transform="translate(80, -30)">
        <rect x="0" y="0" width="120" height="55" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
        <text x="60" y="20" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">기능2</text>
        <text x="60" y="35" font-size="9" fill="#10B981" text-anchor="middle">정육점 특화</text>
        <text x="60" y="48" font-size="9" fill="#10B981" text-anchor="middle">개인화 문구 생성</text>
      </g>

      <!-- Box 3: 맞춤 발송 (Bottom Right) -->
      <g transform="translate(80, 55)">
        <rect x="0" y="0" width="120" height="55" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="60" y="20" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">기능3</text>
        <text x="60" y="35" font-size="9" fill="#F59E0B" text-anchor="middle">고객 맞춤</text>
        <text x="60" y="48" font-size="9" fill="#F59E0B" text-anchor="middle">문자 발송</text>
      </g>

      <!-- Box 4: 자가학습 (Bottom Left) -->
      <g transform="translate(-200, 55)">
        <rect x="0" y="0" width="120" height="55" rx="8" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="1.5"/>
        <text x="60" y="20" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="middle">기능4</text>
        <text x="60" y="35" font-size="9" fill="#8B5CF6" text-anchor="middle">자가학습 기반</text>
        <text x="60" y="48" font-size="9" fill="#8B5CF6" text-anchor="middle">의사결정 최적화</text>
      </g>

      <!-- Circular arrows -->
      <path d="M -70,-50 A 90,90 0 0,1 50,-60" stroke="#CBD5E1" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
      <path d="M 70,-10 A 90,90 0 0,1 70,40" stroke="#CBD5E1" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
      <path d="M 50,90 A 90,90 0 0,1 -70,90" stroke="#CBD5E1" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
      <path d="M -90,40 A 90,90 0 0,1 -90,-10" stroke="#CBD5E1" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
    </g>

    <!-- 사장님 경험 (도입 후) -->
    <rect x="760" y="300" width="560" height="45" rx="8" fill="#ECFDF5"/>
    <text x="1040" y="328" font-size="12" fill="#059669" text-anchor="middle">
      사장님: 대시보드 접속 → 오늘 할 마케팅 2개 확인 → 승인 → 끝 (추천 → 승인)
    </text>
  </g>

  <!-- ==================== SECTION 3: 핵심 변화 ==================== -->
  <g filter="url(#shadow)">
    <rect x="50" y="430" width="1300" height="100" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <text x="700" y="470" font-size="16" font-weight="700" fill="#1E293B" text-anchor="middle">핵심 변화</text>

    <g transform="translate(200, 490)">
      <rect x="0" y="0" width="300" height="30" rx="6" fill="#FEE2E2"/>
      <text x="150" y="21" font-size="12" font-weight="600" fill="#DC2626" text-anchor="middle">분석 → 판단 → 실행</text>
    </g>

    <text x="580" y="510" font-size="24" fill="#7C3AED">→</text>

    <g transform="translate(650, 490)">
      <rect x="0" y="0" width="200" height="30" rx="6" fill="#ECFDF5"/>
      <text x="100" y="21" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">추천 → 승인</text>
    </g>

    <text x="1050" y="510" font-size="11" fill="#64748B" text-anchor="middle">
      복잡한 마케팅 의사결정을 1~2개 액션으로 단순화
    </text>
  </g>

  <!-- ==================== SECTION 4: 기대 효과 ==================== -->
  <g filter="url(#shadow)">
    <rect x="50" y="560" width="620" height="170" rx="16" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>

    <!-- Header -->
    <rect x="50" y="560" width="620" height="45" rx="16" fill="url(#greenGrad)"/>
    <rect x="50" y="589" width="620" height="16" fill="url(#greenGrad)"/>
    <text x="360" y="590" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">기대 효과</text>

    <!-- 3 metrics -->
    <g transform="translate(80, 625)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="180" height="85" rx="10" fill="#FEF2F2"/>
      <text x="90" y="25" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">이탈 예측</text>
      <text x="90" y="55" font-size="24" font-weight="800" fill="#B91C1C" text-anchor="middle">+15%</text>
      <text x="90" y="75" font-size="10" fill="#EF4444" text-anchor="middle">재방문율 향상</text>

      <!-- Metric 2 -->
      <rect x="200" y="0" width="180" height="85" rx="10" fill="#EFF6FF"/>
      <text x="290" y="25" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">품목 수요 분석</text>
      <text x="290" y="55" font-size="24" font-weight="800" fill="#1E40AF" text-anchor="middle">+10%</text>
      <text x="290" y="75" font-size="10" fill="#3B82F6" text-anchor="middle">특정 부위 매출 증대</text>

      <!-- Metric 3 -->
      <rect x="400" y="0" width="180" height="85" rx="10" fill="#ECFDF5"/>
      <text x="490" y="25" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">개인화 메시지</text>
      <text x="490" y="55" font-size="24" font-weight="800" fill="#047857" text-anchor="middle">+20%</text>
      <text x="490" y="75" font-size="10" fill="#10B981" text-anchor="middle">메시지 반응률 개선</text>
    </g>
  </g>

  <!-- ==================== SECTION 5: 확장 전략 ==================== -->
  <g filter="url(#shadow)">
    <rect x="730" y="560" width="620" height="170" rx="16" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>

    <!-- Header -->
    <rect x="730" y="560" width="620" height="45" rx="16" fill="url(#blueGrad)"/>
    <rect x="730" y="589" width="620" height="16" fill="url(#blueGrad)"/>
    <text x="1040" y="590" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">확장 전략</text>

    <!-- 2 stages -->
    <g transform="translate(760, 625)">
      <!-- Stage 1 -->
      <rect x="0" y="0" width="270" height="85" rx="10" fill="#EFF6FF"/>
      <rect x="10" y="10" width="60" height="22" rx="11" fill="#3B82F6"/>
      <text x="40" y="26" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1단계</text>
      <text x="135" y="45" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="middle">예측 기반 마케팅 고도화</text>
      <text x="135" y="65" font-size="10" fill="#3B82F6" text-anchor="middle">날씨·요일·이벤트 데이터 결합</text>
      <text x="135" y="80" font-size="10" fill="#3B82F6" text-anchor="middle">앱푸시·쿠폰·오프라인 연동</text>

      <!-- Arrow -->
      <text x="295" y="45" font-size="20" fill="#CBD5E1">→</text>

      <!-- Stage 2 -->
      <rect x="320" y="0" width="270" height="85" rx="10" fill="#FAF5FF"/>
      <rect x="330" y="10" width="60" height="22" rx="11" fill="#7C3AED"/>
      <text x="360" y="26" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2단계</text>
      <text x="455" y="45" font-size="12" font-weight="600" fill="#6D28D9" text-anchor="middle">산업 확장 및 플랫폼화</text>
      <text x="455" y="65" font-size="10" fill="#8B5CF6" text-anchor="middle">정육점 → 식자재 → 로컬 리테일</text>
      <text x="455" y="80" font-size="10" fill="#8B5CF6" text-anchor="middle">AI 큐레이션 엔진 API 제공</text>
    </g>
  </g>

  <!-- ==================== SECTION 6: 단계별 개발 ==================== -->
  <g filter="url(#shadow)">
    <rect x="50" y="760" width="1300" height="160" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <text x="700" y="795" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">단계별 개발 목표</text>

    <!-- 5 stages -->
    <g transform="translate(70, 820)">
      <!-- Stage 1 -->
      <rect x="0" y="0" width="230" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="14" fill="#3B82F6"/>
      <text x="20" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="125" y="25" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="middle">이탈 예측</text>
      <text x="115" y="50" font-size="10" fill="#64748B">ML 기반 이탈 예측 모형</text>
      <text x="115" y="68" font-size="10" fill="#64748B">5개 매장 검증</text>

      <!-- Stage 2 -->
      <rect x="250" y="0" width="230" height="80" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="270" cy="20" r="14" fill="#10B981"/>
      <text x="270" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="375" y="25" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">수요 예측</text>
      <text x="365" y="50" font-size="10" fill="#64748B">품목별 수요 예측 모형</text>
      <text x="365" y="68" font-size="10" fill="#64748B">고객-품목 매핑</text>

      <!-- Stage 3 -->
      <rect x="500" y="0" width="230" height="80" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
      <circle cx="520" cy="20" r="14" fill="#F59E0B"/>
      <text x="520" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="625" y="25" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">개인화 문구</text>
      <text x="615" y="50" font-size="10" fill="#64748B">정육점 특화 프롬프트 엔진</text>
      <text x="615" y="68" font-size="10" fill="#64748B">개인화 Depth 옵션</text>

      <!-- Stage 4 -->
      <rect x="750" y="0" width="230" height="80" rx="10" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle cx="770" cy="20" r="14" fill="#8B5CF6"/>
      <text x="770" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
      <text x="875" y="25" font-size="12" font-weight="600" fill="#6D28D9" text-anchor="middle">자가학습</text>
      <text x="865" y="50" font-size="10" fill="#64748B">A/B 테스트, 반응 추적</text>
      <text x="865" y="68" font-size="10" fill="#64748B">의사결정 최적화 엔진</text>

      <!-- Stage 5 -->
      <rect x="1000" y="0" width="230" height="80" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
      <circle cx="1020" cy="20" r="14" fill="#EF4444"/>
      <text x="1020" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
      <text x="1125" y="25" font-size="12" font-weight="600" fill="#DC2626" text-anchor="middle">통합 완료</text>
      <text x="1115" y="50" font-size="10" fill="#64748B">Zero-Task 대시보드</text>
      <text x="1115" y="68" font-size="10" fill="#64748B">추천→승인 UX</text>
    </g>
  </g>

</svg>
