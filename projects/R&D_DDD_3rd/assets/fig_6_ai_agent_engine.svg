<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="'NanumGothic','Nanum Gothic','Noto Sans CJK KR',sans-serif">
  <defs>
    <linearGradient id="prebuiltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="projectGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="700" y="40" font-size="26" font-weight="700" fill="#1E293B" text-anchor="middle">
    소상공인 현장 특화 AI 고객관리 에이전트 개발 구조
  </text>

  <!-- Legend -->
  <g transform="translate(1050, 60)">
    <rect x="0" y="0" width="300" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="20" y="20" width="16" height="16" rx="4" fill="#64748B"/>
    <text x="45" y="33" font-size="12" fill="#475569">기 구축 (Pre-R&amp;D)</text>
    <rect x="160" y="20" width="16" height="16" rx="4" fill="#7C3AED"/>
    <text x="185" y="33" font-size="12" fill="#475569">본 과제 (디딤돌)</text>
    <rect x="20" y="50" width="16" height="16" rx="4" fill="#059669"/>
    <text x="45" y="63" font-size="12" fill="#475569">기대 효과</text>
    <rect x="160" y="50" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="185" y="63" font-size="12" fill="#475569">전체 시스템</text>
  </g>

  <!-- Main Container: 전체 AI 에이전트 시스템 -->
  <g filter="url(#shadow)">
    <rect x="50" y="100" width="950" height="680" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="525" y="135" font-size="18" font-weight="700" fill="#1E293B" text-anchor="middle">
      소상공인 현장 특화 AI 고객관리 에이전트 (전체 시스템)
    </text>
  </g>

  <!-- SECTION 1: 기 구축 영역 (Pre-R&D) -->
  <g filter="url(#shadow)">
    <rect x="80" y="160" width="890" height="130" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2" stroke-dasharray="8,4"/>

    <!-- Badge -->
    <rect x="95" y="145" width="120" height="28" rx="14" fill="#64748B"/>
    <text x="155" y="164" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">기 구축 (Pre-R&amp;D)</text>

    <!-- Flow items -->
    <g>
      <rect x="110" y="195" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="190" y="225" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">POS 데이터 연동</text>
      <text x="190" y="245" font-size="11" fill="#94A3B8" text-anchor="middle">1개 매장 파일럿</text>
    </g>

    <line x1="280" y1="230" x2="320" y2="230" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="330" y="195" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="420" y="225" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">방문 변화율 산출</text>
      <text x="420" y="245" font-size="11" fill="#94A3B8" text-anchor="middle">고객별 방문 패턴 분석</text>
    </g>

    <line x1="520" y1="230" x2="560" y2="230" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="570" y="195" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="660" y="225" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">품목 기반 문구 제작</text>
      <text x="660" y="245" font-size="11" fill="#94A3B8" text-anchor="middle">LMS 마케팅 문구</text>
    </g>

    <line x1="760" y1="230" x2="800" y2="230" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="810" y="195" width="140" height="70" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="880" y="225" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">문구 발송</text>
      <text x="880" y="245" font-size="11" fill="#94A3B8" text-anchor="middle">즉시 발송 시스템</text>
    </g>
  </g>

  <!-- Arrow: Pre-R&D to Project -->
  <line x1="525" y1="300" x2="525" y2="330" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="525" y="322" font-size="11" fill="#7C3AED" text-anchor="middle">고도화</text>

  <!-- SECTION 2: 본 과제 영역 (디딤돌) -->
  <g filter="url(#shadow)">
    <rect x="80" y="340" width="890" height="280" rx="16" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2.5"/>

    <!-- Badge -->
    <rect x="95" y="325" width="140" height="28" rx="14" fill="#7C3AED"/>
    <text x="165" y="344" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">본 과제 (디딤돌)</text>

    <!-- Title -->
    <text x="525" y="375" font-size="16" font-weight="700" fill="#5B21B6" text-anchor="middle">
      AI 에이전트 핵심 의사결정 엔진
    </text>
    <text x="525" y="395" font-size="12" fill="#7C3AED" text-anchor="middle">
      "누구에게 · 무엇을 · 언제" 자동 판단 체계
    </text>

    <!-- Three Core Engines -->
    <!-- Engine 1: 타겟 추출 -->
    <g>
      <rect x="110" y="420" width="260" height="175" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
      <rect x="110" y="420" width="260" height="45" rx="14" fill="#3B82F6"/>
      <rect x="110" y="451" width="260" height="14" fill="#3B82F6"/>
      <text x="240" y="450" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">타겟 추출 엔진</text>
      <rect x="300" y="428" width="60" height="22" rx="11" fill="rgba(255,255,255,0.25)"/>
      <text x="330" y="444" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">누구에게</text>

      <text x="240" y="490" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="middle">이탈 예측 모형</text>
      <text x="130" y="515" font-size="11" fill="#475569">• 이탈 위험 고객 자동 식별</text>
      <text x="130" y="535" font-size="11" fill="#475569">• 고객별 맞춤 이탈 기준 도출</text>
      <text x="130" y="555" font-size="11" fill="#475569">• RF 이중모형 / 월 1회 재학습</text>
      <rect x="130" y="570" width="220" height="20" rx="10" fill="#EFF6FF"/>
      <text x="240" y="584" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="middle">5개 매장 확장 검증</text>
    </g>

    <!-- Engine 2: 개인화 생성 -->
    <g>
      <rect x="395" y="420" width="260" height="175" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <rect x="395" y="420" width="260" height="45" rx="14" fill="#10B981"/>
      <rect x="395" y="451" width="260" height="14" fill="#10B981"/>
      <text x="525" y="450" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">개인화 생성 엔진</text>
      <rect x="575" y="428" width="60" height="22" rx="11" fill="rgba(255,255,255,0.25)"/>
      <text x="605" y="444" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">무엇을</text>

      <text x="525" y="490" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">LLM 개인화 문구 생성</text>
      <text x="415" y="515" font-size="11" fill="#475569">• 파편 데이터 통합 활용</text>
      <text x="415" y="535" font-size="11" fill="#475569">• 구매이력·선호부위·계절·명절</text>
      <text x="415" y="555" font-size="11" fill="#475569">• 화이트리스트 프롬프트 엔진</text>
      <rect x="415" y="570" width="220" height="20" rx="10" fill="#ECFDF5"/>
      <text x="525" y="584" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">1:1 맞춤 메시지 자동 생성</text>
    </g>

    <!-- Engine 3: 발송 최적화 -->
    <g>
      <rect x="680" y="420" width="260" height="175" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
      <rect x="680" y="420" width="260" height="45" rx="14" fill="#F59E0B"/>
      <rect x="680" y="451" width="260" height="14" fill="#F59E0B"/>
      <text x="810" y="450" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">발송 최적화 엔진</text>
      <rect x="870" y="428" width="50" height="22" rx="11" fill="rgba(255,255,255,0.25)"/>
      <text x="895" y="444" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">언제</text>

      <text x="810" y="490" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">최적 발송 시점 판단</text>
      <text x="700" y="515" font-size="11" fill="#475569">• 고객별 반응률 분석</text>
      <text x="700" y="535" font-size="11" fill="#475569">• 요일·시간대별 최적화</text>
      <text x="700" y="555" font-size="11" fill="#475569">• 구매 주기 기반 타이밍</text>
      <rect x="700" y="570" width="220" height="20" rx="10" fill="#FFFBEB"/>
      <text x="810" y="584" font-size="10" font-weight="600" fill="#D97706" text-anchor="middle">자동 스케줄링 파이프라인</text>
    </g>
  </g>

  <!-- Arrow: Project to Integration -->
  <line x1="525" y1="630" x2="525" y2="660" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- SECTION 3: 통합 결과 -->
  <g>
    <rect x="80" y="670" width="890" height="90" rx="16" fill="#F0FDF4" stroke="#059669" stroke-width="2"/>

    <!-- Badge -->
    <rect x="95" y="655" width="100" height="28" rx="14" fill="#059669"/>
    <text x="145" y="674" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">통합 완료</text>

    <text x="525" y="710" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">
      Zero-Task AI 에이전트 완성
    </text>
    <text x="525" y="735" font-size="13" fill="#059669" text-anchor="middle">
      "사장님이 아무것도 하지 않아도 AI가 고객을 분석하고 마케팅을 자동 집행"
    </text>
  </g>

  <!-- SECTION 4: 기대 효과 (오른쪽) -->
  <g filter="url(#shadow)">
    <rect x="1030" y="160" width="320" height="620" rx="20" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>

    <!-- Header -->
    <rect x="1030" y="160" width="320" height="55" rx="20" fill="url(#resultGrad)"/>
    <rect x="1030" y="195" width="320" height="20" fill="url(#resultGrad)"/>
    <text x="1190" y="195" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">기대 효과</text>

    <!-- Metric Cards -->
    <!-- 1. 이탈률 감소 -->
    <g>
      <rect x="1055" y="235" width="270" height="85" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
      <text x="1190" y="262" font-size="13" font-weight="700" fill="#DC2626" text-anchor="middle">고객 이탈률 감소</text>
      <text x="1190" y="290" font-size="28" font-weight="800" fill="#B91C1C" text-anchor="middle">-30%</text>
      <text x="1190" y="310" font-size="11" fill="#EF4444" text-anchor="middle">이탈 위험 고객 선제 대응</text>
    </g>

    <!-- 2. 재방문율 증가 -->
    <g>
      <rect x="1055" y="335" width="270" height="85" rx="12" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1"/>
      <text x="1190" y="362" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">고객 재방문율 증가</text>
      <text x="1190" y="390" font-size="28" font-weight="800" fill="#047857" text-anchor="middle">+25%</text>
      <text x="1190" y="410" font-size="11" fill="#10B981" text-anchor="middle">개인화 마케팅 효과</text>
    </g>

    <!-- 3. 매출 향상 -->
    <g>
      <rect x="1055" y="435" width="270" height="85" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
      <text x="1190" y="462" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">매장 매출 향상</text>
      <text x="1190" y="490" font-size="28" font-weight="800" fill="#1E40AF" text-anchor="middle">+10~15%</text>
      <text x="1190" y="510" font-size="11" fill="#3B82F6" text-anchor="middle">단골 유지 + 재구매 촉진</text>
    </g>

    <!-- 4. 마케팅 비용 절감 -->
    <g>
      <rect x="1055" y="535" width="270" height="85" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
      <text x="1190" y="562" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">마케팅 비용 절감</text>
      <text x="1190" y="590" font-size="28" font-weight="800" fill="#B45309" text-anchor="middle">-50%</text>
      <text x="1190" y="610" font-size="11" fill="#F59E0B" text-anchor="middle">대행사 대비 비용 절감</text>
    </g>

    <!-- 5. 운영 시간 절감 -->
    <g>
      <rect x="1055" y="635" width="270" height="85" rx="12" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
      <text x="1190" y="662" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">사장님 운영 시간 절감</text>
      <text x="1190" y="690" font-size="28" font-weight="800" fill="#6D28D9" text-anchor="middle">Zero-Task</text>
      <text x="1190" y="710" font-size="11" fill="#8B5CF6" text-anchor="middle">완전 자동화로 개입 불필요</text>
    </g>

    <!-- 6. 디지털 격차 해소 -->
    <g>
      <rect x="1055" y="735" width="270" height="30" rx="8" fill="#059669"/>
      <text x="1190" y="756" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">AI 격차 해소 · 디지털 포용 실현</text>
    </g>
  </g>

  <!-- Arrow from main system to results -->
  <path d="M 980 500 Q 1010 500 1025 500" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

</svg>
