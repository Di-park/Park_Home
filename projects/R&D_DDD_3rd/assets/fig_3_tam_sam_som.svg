<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'NanumGothic','Nanum Gothic','Noto Sans CJK KR',sans-serif">
  <defs>
    <linearGradient id="tamGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="samGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
    <linearGradient id="somGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="600" y="45" font-size="26" font-weight="700" fill="#1E293B" text-anchor="middle">
    시장 규모 (TAM-SAM-SOM)
  </text>
  <text x="600" y="75" font-size="14" fill="#64748B" text-anchor="middle">
    소상공인 AI 고객관리 에이전트 시장
  </text>

  <!-- TAM Circle (Outermost) - Perfect Circle -->
  <g filter="url(#shadow)">
    <circle cx="450" cy="400" r="280" fill="url(#tamGrad)" stroke="#A5B4FC" stroke-width="2.5"/>
  </g>

  <!-- SAM Circle (Middle) - Perfect Circle -->
  <g filter="url(#shadowSmall)">
    <circle cx="450" cy="420" r="175" fill="url(#samGrad)" stroke="#C4B5FD" stroke-width="2"/>
  </g>

  <!-- SOM Circle (Innermost) - Perfect Circle -->
  <g filter="url(#shadowSmall)">
    <circle cx="450" cy="440" r="90" fill="url(#somGrad)" stroke="#8B5CF6" stroke-width="2"/>
  </g>

  <!-- TAM Label (Top area of outer circle) -->
  <text x="450" y="160" font-size="18" font-weight="700" fill="#4338CA" text-anchor="middle">TAM</text>
  <text x="450" y="190" font-size="28" font-weight="800" fill="#4338CA" text-anchor="middle">약 7조원</text>
  <text x="450" y="218" font-size="12" fill="#6366F1" text-anchor="middle">전체 B2C 소상공인 (~300만개)</text>

  <!-- SAM Label (Middle area) -->
  <text x="450" y="290" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">SAM</text>
  <text x="450" y="318" font-size="22" font-weight="800" fill="#7C3AED" text-anchor="middle">약 1조원</text>
  <text x="450" y="342" font-size="11" fill="#8B5CF6" text-anchor="middle">식품 소매·외식 (~90만개)</text>

  <!-- SOM Label (Center) -->
  <text x="450" y="425" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">SOM</text>
  <text x="450" y="452" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">2,200억원</text>
  <text x="450" y="476" font-size="10" fill="#EDE9FE" text-anchor="middle">정육점 (5.8만개)</text>

  <!-- Right Side: Detail Cards -->

  <!-- TAM Detail Card -->
  <g filter="url(#shadowSmall)">
    <rect x="780" y="115" width="360" height="130" rx="16" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="780" y="115" width="360" height="42" rx="16" fill="#4338CA"/>
    <rect x="780" y="141" width="360" height="16" fill="#4338CA"/>
    <text x="960" y="143" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">TAM (Total Addressable Market)</text>

    <text x="800" y="180" font-size="12" fill="#475569">• 전체 소상공인 613만개 중 B2C 재방문 기반 업종</text>
    <text x="800" y="202" font-size="12" fill="#475569">• 음식점·소매·미용·서비스 등 약 300만개</text>
    <text x="800" y="224" font-size="12" fill="#475569">• 평균 연매출 2.5억원 × CRM 지출 1% = <tspan font-weight="700" fill="#4338CA">약 7조원</tspan></text>
  </g>

  <!-- SAM Detail Card -->
  <g filter="url(#shadowSmall)">
    <rect x="780" y="265" width="360" height="130" rx="16" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="780" y="265" width="360" height="42" rx="16" fill="#7C3AED"/>
    <rect x="780" y="291" width="360" height="16" fill="#7C3AED"/>
    <text x="960" y="293" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">SAM (Serviceable Addressable Market)</text>

    <text x="800" y="330" font-size="12" fill="#475569">• 음식점 약 70만개 + 식품소매 약 20만개</text>
    <text x="800" y="352" font-size="12" fill="#475569">• 정육·반찬·청과·마트·외식 등 식품 관련 업종</text>
    <text x="800" y="374" font-size="12" fill="#475569">• 평균 연매출 × CRM 1% = <tspan font-weight="700" fill="#7C3AED">약 1조원</tspan></text>
  </g>

  <!-- SOM Detail Card -->
  <g filter="url(#shadowSmall)">
    <rect x="780" y="415" width="360" height="130" rx="16" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="780" y="415" width="360" height="42" rx="16" fill="#6D28D9"/>
    <rect x="780" y="441" width="360" height="16" fill="#6D28D9"/>
    <text x="960" y="443" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">SOM (Serviceable Obtainable Market)</text>

    <text x="800" y="480" font-size="12" fill="#475569">• 정육점 57,783개 (통계청 서비스업조사)</text>
    <text x="800" y="502" font-size="12" fill="#475569">• 평균 연매출 3.8억원 × CRM 지출 1%</text>
    <text x="800" y="524" font-size="12" fill="#475569">• 57,783 × 380만원 = <tspan font-weight="700" fill="#6D28D9">약 2,200억원</tspan></text>
  </g>

  <!-- Connecting Lines (curved) -->
  <path d="M 730 180 Q 755 180 775 180" stroke="#A5B4FC" stroke-width="2" fill="none"/>
  <path d="M 625 350 Q 700 330 775 330" stroke="#C4B5FD" stroke-width="2" fill="none"/>
  <path d="M 540 460 Q 660 480 775 480" stroke="#8B5CF6" stroke-width="2" fill="none"/>

  <!-- Bottom: Expansion Strategy -->
  <g filter="url(#shadowSmall)">
    <rect x="170" y="630" width="860" height="55" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Step indicators -->
    <circle cx="280" cy="657" r="18" fill="#6D28D9"/>
    <text x="280" y="663" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="350" y="663" font-size="13" font-weight="600" fill="#6D28D9">정육점</text>

    <text x="430" y="663" font-size="16" fill="#CBD5E1">→</text>

    <circle cx="490" cy="657" r="18" fill="#7C3AED"/>
    <text x="490" y="663" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="590" y="663" font-size="13" font-weight="600" fill="#7C3AED">식품소매·외식</text>

    <text x="700" y="663" font-size="16" fill="#CBD5E1">→</text>

    <circle cx="760" cy="657" r="18" fill="#4338CA"/>
    <text x="760" y="663" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="870" y="663" font-size="13" font-weight="600" fill="#4338CA">전체 소상공인</text>
  </g>

  <!-- Source Note -->
  <text x="600" y="720" font-size="10" fill="#94A3B8" text-anchor="middle">
    출처: 중소벤처기업부 소상공인실태조사(2024), 한식산업실태조사(2024), 통계청 서비스업조사
  </text>
</svg>
