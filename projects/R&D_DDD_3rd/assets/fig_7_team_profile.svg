<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" font-family="'NanumGothic','Nanum Gothic','Noto Sans CJK KR',sans-serif">
  <defs>
    <linearGradient id="headerGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="headerGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="headerGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="headerGrad4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="headerGrad5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="400" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="700" y="40" font-size="24" font-weight="700" fill="#1E293B" text-anchor="middle">연구팀 구성</text>

  <!-- 5 Profile Cards -->

  <!-- Card 1: 안동철 - 연구 총괄 -->
  <g transform="translate(40, 70)" filter="url(#cardShadow)">
    <!-- Card body -->
    <rect x="0" y="0" width="250" height="300" rx="16" fill="#FFFFFF"/>
    <!-- Header -->
    <rect x="0" y="0" width="250" height="60" rx="16" fill="url(#headerGrad1)"/>
    <rect x="0" y="44" width="250" height="16" fill="url(#headerGrad1)"/>
    <text x="125" y="40" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">연구 총괄</text>

    <!-- Profile circle -->
    <circle cx="125" cy="100" r="35" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3"/>
    <text x="125" y="108" font-size="20" font-weight="700" fill="#4F46E5" text-anchor="middle">PI</text>

    <!-- Name -->
    <text x="125" y="160" font-size="18" font-weight="700" fill="#1E293B" text-anchor="middle">안동철</text>
    <text x="125" y="180" font-size="11" fill="#64748B" text-anchor="middle">연구책임자 · 대표이사</text>

    <!-- Details -->
    <line x1="30" y1="200" x2="220" y2="200" stroke="#E2E8F0" stroke-width="1"/>
    <text x="125" y="225" font-size="11" fill="#475569" text-anchor="middle">한밭대 컴퓨터공학</text>
    <text x="125" y="245" font-size="11" fill="#475569" text-anchor="middle">스타트업 CTO 8년</text>
    <text x="125" y="265" font-size="11" fill="#475569" text-anchor="middle">데이터 파이프라인</text>
    <text x="125" y="285" font-size="11" fill="#475569" text-anchor="middle">시스템 설계·구축</text>
  </g>

  <!-- Card 2: 배현혜 - AI 개발 -->
  <g transform="translate(310, 70)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="250" height="300" rx="16" fill="#FFFFFF"/>
    <rect x="0" y="0" width="250" height="60" rx="16" fill="url(#headerGrad2)"/>
    <rect x="0" y="44" width="250" height="16" fill="url(#headerGrad2)"/>
    <text x="125" y="40" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI 개발</text>

    <circle cx="125" cy="100" r="35" fill="#ECFEFF" stroke="#0891B2" stroke-width="3"/>
    <text x="125" y="108" font-size="20" font-weight="700" fill="#0891B2" text-anchor="middle">ML</text>

    <text x="125" y="160" font-size="18" font-weight="700" fill="#1E293B" text-anchor="middle">배현혜</text>
    <text x="125" y="180" font-size="11" fill="#64748B" text-anchor="middle">선임연구원</text>

    <line x1="30" y1="200" x2="220" y2="200" stroke="#E2E8F0" stroke-width="1"/>
    <text x="125" y="225" font-size="11" fill="#475569" text-anchor="middle">Columbia Univ. 박사</text>
    <text x="125" y="245" font-size="11" fill="#475569" text-anchor="middle">KAIST · 서울대 석사</text>
    <text x="125" y="265" font-size="11" fill="#475569" text-anchor="middle">이탈 예측 모델링</text>
    <text x="125" y="285" font-size="11" fill="#475569" text-anchor="middle">통계 분석 · RCT 설계</text>
  </g>

  <!-- Card 3: Seo, Charles - UX 설계 -->
  <g transform="translate(580, 70)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="250" height="300" rx="16" fill="#FFFFFF"/>
    <rect x="0" y="0" width="250" height="60" rx="16" fill="url(#headerGrad3)"/>
    <rect x="0" y="44" width="250" height="16" fill="url(#headerGrad3)"/>
    <text x="125" y="40" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">UX 설계</text>

    <circle cx="125" cy="100" r="35" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>
    <text x="125" y="108" font-size="20" font-weight="700" fill="#059669" text-anchor="middle">UX</text>

    <text x="125" y="160" font-size="18" font-weight="700" fill="#1E293B" text-anchor="middle">Seo, Charles</text>
    <text x="125" y="180" font-size="11" fill="#64748B" text-anchor="middle">연구원 · Product Owner</text>

    <line x1="30" y1="200" x2="220" y2="200" stroke="#E2E8F0" stroke-width="1"/>
    <text x="125" y="225" font-size="11" fill="#475569" text-anchor="middle">KAIST 석사 · 박사수료</text>
    <text x="125" y="245" font-size="11" fill="#475569" text-anchor="middle">스타트업 PO</text>
    <text x="125" y="265" font-size="11" fill="#475569" text-anchor="middle">사용성 평가 설계</text>
    <text x="125" y="285" font-size="11" fill="#475569" text-anchor="middle">디지털 취약계층 UX</text>
  </g>

  <!-- Card 4: 이지백 - 현장 적용 -->
  <g transform="translate(850, 70)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="250" height="300" rx="16" fill="#FFFFFF"/>
    <rect x="0" y="0" width="250" height="60" rx="16" fill="url(#headerGrad4)"/>
    <rect x="0" y="44" width="250" height="16" fill="url(#headerGrad4)"/>
    <text x="125" y="40" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">현장 적용</text>

    <circle cx="125" cy="100" r="35" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
    <text x="125" y="108" font-size="18" font-weight="700" fill="#D97706" text-anchor="middle">BIZ</text>

    <text x="125" y="160" font-size="18" font-weight="700" fill="#1E293B" text-anchor="middle">이지백</text>
    <text x="125" y="180" font-size="11" fill="#64748B" text-anchor="middle">연구원 · 도메인 전문가</text>

    <line x1="30" y1="200" x2="220" y2="200" stroke="#E2E8F0" stroke-width="1"/>
    <text x="125" y="225" font-size="11" fill="#475569" text-anchor="middle">충남대 경영학 박사</text>
    <text x="125" y="245" font-size="11" fill="#475569" text-anchor="middle">로컬 마케팅 13년</text>
    <text x="125" y="265" font-size="11" fill="#475569" text-anchor="middle">파일럿 매장 섭외</text>
    <text x="125" y="285" font-size="11" fill="#475569" text-anchor="middle">사업화 전략 수립</text>
  </g>

  <!-- Card 5: 박동일 - 행정 지원 -->
  <g transform="translate(1120, 70)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="250" height="300" rx="16" fill="#FFFFFF"/>
    <rect x="0" y="0" width="250" height="60" rx="16" fill="url(#headerGrad5)"/>
    <rect x="0" y="44" width="250" height="16" fill="url(#headerGrad5)"/>
    <text x="125" y="40" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">행정 지원</text>

    <circle cx="125" cy="100" r="35" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>
    <text x="125" y="108" font-size="18" font-weight="700" fill="#DC2626" text-anchor="middle">IR</text>

    <text x="125" y="160" font-size="18" font-weight="700" fill="#1E293B" text-anchor="middle">박동일</text>
    <text x="125" y="180" font-size="11" fill="#64748B" text-anchor="middle">연구원</text>

    <line x1="30" y1="200" x2="220" y2="200" stroke="#E2E8F0" stroke-width="1"/>
    <text x="125" y="225" font-size="11" fill="#475569" text-anchor="middle">한밭대 회계학</text>
    <text x="125" y="245" font-size="11" fill="#475569" text-anchor="middle">정부과제 행정</text>
    <text x="125" y="265" font-size="11" fill="#475569" text-anchor="middle">예산 관리·정산</text>
    <text x="125" y="285" font-size="11" fill="#475569" text-anchor="middle">특허/논문 행정</text>
  </g>

</svg>
